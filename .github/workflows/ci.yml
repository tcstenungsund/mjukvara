site_name: Mjukvara
site_description: FOSS-rekommendationer för gymnasiet
site_url: https://tcstenungsund.github.io/mjukvara/
repo_url: https://github.com/tcstenungsund/mjukvara/
repo_name: tcstenungsund/mjukvara

theme:
  name: material
  language: sv
  palette:
    scheme: slate
    primary: indigo
    accent: purple
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.footer
    - search.highlight
    - content.action.edit

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - codehilite

nav:
  - Översikt: index.md
  - Videoredigering: video/index.md
  - Nätverk & Infrastruktur: natverk/index.md
  - Utveckling & Kodning: utveckling/index.md
  - Grafik & Bild: grafik/index.md
  - Webb & Webbläsare: webb/index.md
  - AI & Maskininlärning: ai/index.md
  - Ljud & Musik: ljud/index.md
  - Kontor & Produktivitet: kontor/index.md
  - Säkerhet & Integritet: sakerhet/index.md
  - Operativsystem: os/index.md
